  :root {
    --bg: #F6F4F0;
    --surface: #FFFFFF;
    --ink: #262626;
    --muted: #7A7670;
    --line: rgba(38, 38, 38, 0.12);
    --powder: #C7D6EC;
    --powder-soft: #E6EDF7;
    --cherry: #C93C63;
    --stripe-a: #9DB8E0;
    --stripe-b: #E9A9BC;
    --on-ink: #FFFFFF;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1C1E;
      --surface: #262628;
      --ink: #F2EFEA;
      --muted: #A7A29B;
      --line: rgba(242, 239, 234, 0.14);
      --powder: #5D7398;
      --powder-soft: #2C3444;
      --cherry: #E8728F;
      --on-ink: #1C1C1E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1C1E;
    --surface: #262628;
    --ink: #F2EFEA;
    --muted: #A7A29B;
    --line: rgba(242, 239, 234, 0.14);
    --powder: #5D7398;
    --powder-soft: #2C3444;
    --cherry: #E8728F;
    --on-ink: #1C1C1E;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "SUIT", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: -0.01em;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 460px; margin: 0 auto; min-height: 100%; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; letter-spacing: inherit; }
  button:focus-visible { outline: 2px solid var(--cherry); outline-offset: 3px; }

  .label {
    display: inline-flex;
    align-items: center;
    background: #FFFFFF;
    color: #1E2B4A;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    padding: 3px 9px;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(30, 43, 74, 0.12);
  }

  /* Intro */
  html, body { height: 100%; }
  main { display: flex; flex-direction: column; }
  body.stripe { background: #FBF6F0 var(--stripe-img) center / cover; }
  .intro { flex: 1; display: flex; align-items: center; padding: 32px 20px; }
  .intro-card {
    width: 100%;
    background: #FFFFFF;
    color: #262626;
    border-radius: 20px;
    padding: 32px 26px 26px;
    box-shadow: 0 14px 36px rgba(60, 70, 100, 0.14);
  }
  .intro-card .kicker { font-size: 13px; font-weight: 500; color: #7A7670; letter-spacing: 0; }
  .intro h1 { margin-top: 6px; font-size: 36px; line-height: 1.25; letter-spacing: -0.035em; }
  .intro .lead { margin-top: 12px; color: #7A7670; font-size: 16px; }
  .cta {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 17px 20px;
    border: 0;
    border-radius: 14px;
    background: var(--ink);
    color: var(--on-ink);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .intro-card .cta { background: #262626; color: #FFFFFF; }
  .cta.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); margin-top: 10px; }
  .meta { margin-top: 12px; color: #7A7670; font-size: 13px; text-align: center; }

  /* Quiz */
  .quiz { padding: 28px 24px 40px; }
  .segments { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .segments i { display: block; height: 3px; border-radius: 2px; background: var(--line); }
  .segments i.done { background: var(--ink); }
  .qnum { margin-top: 28px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .q { margin-top: 6px; font-size: 26px; line-height: 1.4; letter-spacing: -0.025em; }
  .opts { margin-top: 28px; display: grid; gap: 8px; }
  .opt {
    width: 100%;
    text-align: left;
    padding: 17px 18px;
    border: 0;
    border-radius: 14px;
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px var(--line);
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .opt:hover { background: var(--powder-soft); box-shadow: inset 0 0 0 1px var(--powder); }
  .opt.picked { background: var(--powder); box-shadow: inset 0 0 0 1px var(--powder); }
  .back { margin-top: 20px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: 14px; cursor: pointer; }

  /* Result */
  .result { padding-bottom: 40px; }
  .fabric {
    position: relative;
    padding: 36px 24px 32px;
    background:
      repeating-linear-gradient(90deg,
        #B9D3EE 0 22px,
        transparent 22px 36px,
        #7B4A33 36px 39px,
        transparent 39px 54px),
      #FBF6F0;
  }
  .fabric .label { position: absolute; right: 24px; top: 20px; }
  .card {
    background: #FFFFFF;
    color: #262626;
    border-radius: 18px;
    padding: 26px 22px 24px;
    box-shadow: 0 1px 0 rgba(38, 38, 38, 0.04), 0 12px 32px rgba(60, 70, 100, 0.10);
  }
  .card .kicker { color: #7A7670; font-size: 14px; font-weight: 500; }
  .card h2 { margin-top: 4px; font-size: 32px; letter-spacing: -0.035em; line-height: 1.2; }
  .card .tagline { margin-top: 10px; font-size: 17px; color: #7B4A33; letter-spacing: -0.02em; }
  .card .desc { margin-top: 14px; color: #55524D; font-size: 15px; }
  .section { padding: 28px 24px 0; }
  .section h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .item { min-width: 0; display: block; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a.item:active .ph { transform: scale(0.97); }
  .item .go { display: inline-block; margin-top: 6px; color: #7B4A33; font-size: 12.5px; font-weight: 700; }
  .item .ph { aspect-ratio: 1; border-radius: 14px; background: #ECE6DC; overflow: hidden; }
  .item .ph img { display: block; width: 100%; height: 100%; object-fit: contain; padding: 6%; filter: drop-shadow(0 6px 8px rgba(60, 45, 30, 0.14)); }
  .item .ph.empty { background: var(--powder-soft); }
  .item strong { display: block; margin-top: 9px; font-size: 14px; font-weight: 600; line-height: 1.4; letter-spacing: -0.02em; }
  .item span { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .match { display: flex; gap: 14px; align-items: baseline; padding: 16px 18px; border-radius: 14px; background: var(--powder-soft); font-size: 15px; }
  .match b { flex: none; font-weight: 700; }
  .toast { min-height: 1.5em; margin-top: 10px; color: var(--muted); font-size: 13px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 9px 13px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px var(--line);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .footer { padding: 32px 24px 0; text-align: center; color: var(--muted); font-size: 12px; }

  .reveal { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; }
    .opt { transition: none; }
  }
</style>
</head>

    match: ["D", "이야기만으로 밤새울 수 있는 사이"]
  },
  F: {
    name: "와글와글 아지트",
    tagline: "우리 집은 늘 열려 있어",
    desc: "친구들이 제일 자주 놀러 오는 집의 주인. 일단 들어오면 다들 하나씩 끌어안고 안 놔줘요. 북적북적해도 편한 방이 딱이에요.",
    items: [
      ["다이노 바디필로우", "내 몸에 딱! 안성맞춤!"],
      ["롱 테일 캣 바디필로우", "친구들과 수다 떨 때 전용 아이템"],
      ["길쭉한 깜냥이 바디필로우", "너 하나, 나 하나 우정템 추천!"]
    ],
    match: ["C", "초대하면 집들이 운까지 챙겨주는 친구"]
  }
};

const QUESTIONS = [
  { q: "퇴근하고 현관문을 열자마자\n제일 먼저 하는 일은?", o: [
    ["옷도 안 갈아입고 침대로 다이빙", "A"],
    ["소파에 녹아내리듯 눕기", "B"],
    ["조명부터 은은하게 바꾸기", "D"],
    ["친구한테 “뭐해?” 보내기", "F"] ] },
  { q: "주말 아침, 눈을 떴을 때 나는?", o: [
    ["이불 속에서 12시까지 버티기", "A"],
    ["일어나자마자 침구부터 반듯하게", "E"],
    ["오늘의 운세부터 확인", "C"],
    ["친구들 초대 계획 세우기", "F"] ] },
  { q: "방에 딱 하나만 들일 수 있다면?", o: [
    ["온몸을 감싸는 커다란 쿠션", "A"],
    ["기대면 몸이 스르르 녹는 길쭉한 베개", "B"],
    ["좋은 기운이 들어오는 행운템", "C"],
    ["방 안을 채우는 은은한 향", "D"] ] },
  { q: "잠들기 전 나의 루틴은?", o: [
    ["루틴? 없음. 눕자마자 기절", "A"],
    ["베개에 향 칙칙 뿌리기", "E"],
    ["플레이리스트 틀고 감성 충전", "D"],
    ["내일 운세 미리 보기", "C"] ] },
  { q: "친구가 우리 집에 오면\n꼭 하는 말은?", o: [
    ["“여기 진짜 호텔 같다”", "E"],
    ["“여기 있으면 잠이 잘 와”", "B"],
    ["“너네 집 왜 이렇게 별게 다 있냐”", "F"],
    ["“뭔가 기운이 좋은 집이야”", "C"] ] },
  { q: "요즘 나에게 제일 필요한 건?", o: [
    ["아무것도 안 하는 하루", "B"],
    ["꽉 안아줄 무언가", "A"],
    ["일이 술술 풀리는 행운", "C"],
    ["나만의 조용한 밤", "D"] ] },
  { q: "같이 살 룸메이트를 고른다면?", o: [
    ["하루 종일 자는 뚱냥이", "A"],
    ["액체처럼 늘어지는 고양이", "B"],
    ["뛰어노는 공룡이랑 강아지", "F"],
    ["우아하게 앉아 있는 여우", "E"] ] },
  { q: "내 방을 한 단어로 표현하면?", o: [
    ["한번 빠지면 못 나오는 늪", "B"],
    ["조용하고 깔끔한 호텔", "E"],
    ["친구들의 아지트", "F"],
    ["나만 아는 비밀기지", "D"] ] }
];

const app = document.getElementById("app");
let answers = [];
let step = 0;
let myResult = null;

// ── 집계 연결 ─────────────────────────────────────────
// Apps Script 배포 후 받은 웹앱 URL(…/exec)을 아래 따옴표 안에 붙여넣어 주세요.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz1ArcduDtTMksyOvMdDfF63xgM3ypwZOZegY9Sioc6L8px2thjsNqVT0ezoRquda11mA/exec";
const SID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const params = new URLSearchParams(location.search);
const SOURCE = params.get("utm_source") || (document.referrer ? (() => { try { return new URL(document.referrer).hostname; } catch (e) { return "referrer"; } })() : "direct");
let startedAt = 0;
function track(event, data) {
  if (!/^https:\/\/script\.google\.com\//.test(ENDPOINT)) return;
  const body = JSON.stringify(Object.assign({ sid: SID, event, source: SOURCE, mobile: /Mobi|Android/i.test(navigator.userAgent) }, data || {}));
  try {
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
  } catch (e) {}
}
track("view");

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function lines(s) { return s.split("\n").map(esc).join("<br>"); }

function renderIntro() {
  document.body.classList.add("stripe");
  app.innerHTML = `
    <section class="intro">
      <div class="intro-card reveal">
        <p class="kicker">mnms room test</p>
        <h1 class="serif">나에게 어울리는<br>방은?</h1>
        <p class="lead">질문 8개로 알아보는 나의 방 취향.<br>결과에 맞춰 미뇽맨션의 아이템을 골라드려요.</p>
        <button class="cta" id="start">테스트 시작하기</button>
        <p class="meta">약 1분 소요</p>
      </div>
    </section>`;
  document.getElementById("start").onclick = () => { answers = []; step = 0; startedAt = Date.now(); track("start"); document.body.classList.remove("stripe"); renderQuestion(); };
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const item = QUESTIONS[step];
  app.innerHTML = `
    <section class="quiz">
      <div class="segments" aria-hidden="true">
        ${QUESTIONS.map((_, i) => `<i class="${i < step ? "done" : ""}"></i>`).join("")}
      </div>
      <p class="qnum">Q${step + 1} / ${QUESTIONS.length}</p>
      <h2 class="q serif">${lines(item.q)}</h2>
      <div class="opts">
        ${item.o.map(op => `<button class="opt${answers[step] === op[1] ? "" : ""}" data-k="${op[1]}">${esc(op[0])}</button>`).join("")}
      </div>
      ${step > 0 ? `<button class="back" id="back">이전 질문</button>` : ""}
    </section>`;
  app.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => {
      btn.classList.add("picked");
      answers[step] = btn.dataset.k;
      track("answer", { step: step + 1, choice: btn.dataset.k });
      setTimeout(() => {
        step++;
        if (step < QUESTIONS.length) renderQuestion();
        else { myResult = score(); track("complete", { result: myResult, answers: answers.join(""), ms: Date.now() - startedAt }); renderResult(myResult); }
      }, 160);
    };
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { step--; renderQuestion(); };
  window.scrollTo(0, 0);
}

function score() {
  const tally = {};
  answers.forEach(k => tally[k] = (tally[k] || 0) + 1);
  const max = Math.max(...Object.values(tally));
  for (let i = answers.length - 1; i >= 0; i--) {
    if (tally[answers[i]] === max) return answers[i];
  }
  return answers[answers.length - 1];
}

function renderResult(key) {
  const r = ROOMS[key];
  const mine = key === myResult;
  const m = ROOMS[r.match[0]];
  app.innerHTML = `
    <section class="result">
      <div class="fabric">
        <div class="card reveal">
          <p class="kicker">${mine ? "나에게 어울리는 방은" : "다른 방 구경하기"}</p>
          <h2 class="serif">${esc(r.name)}</h2>
          <p class="tagline serif">“${esc(r.tagline)}”</p>
          <p class="desc">${esc(r.desc)}</p>
        </div>
      </div>
      <div class="section">
        <h3>이 방에 어울리는 미뇽맨션 아이템</h3>
        <div class="items">
          ${r.items.map(([n, d]) => { const u = shopUrl(n); const inner = `<div class="ph${PHOTOS[n] ? "" : " empty"}">${PHOTOS[n] ? `<img src="${PHOTOS[n]}" alt="${esc(n)}">` : ""}</div><strong>${esc(n)}</strong><span>${esc(d)}</span>${u ? `<b class="go">보러가기 →</b>` : ""}`; return u ? `<a class="item" href="${u}" target="_blank" rel="noopener" data-name="${esc(n)}">${inner}</a>` : `<div class="item">${inner}</div>`; }).join("")}
        </div>
      </div>
      <div class="section">
        <div class="match"><b>잘 맞는 방</b><span>${esc(m.name)} · ${esc(r.match[1])}</span></div>
      </div>
      <div class="section">
        <button class="cta" id="copy" style="margin-top:0">결과 문구 복사하기</button>
        <button class="cta secondary" id="retry">다시 하기</button>
        <p class="toast" id="toast" role="status"></p>
      </div>
      <div class="section">
        <h3>다른 방도 구경하기</h3>
        <div class="chips">
          ${Object.keys(ROOMS).map(k => `<button class="chip" data-k="${k}" aria-pressed="${k === key}">${k === myResult ? "내 방 · " : ""}${esc(ROOMS[k].name)}</button>`).join("")}
        </div>
      </div>
      <p class="footer">mnms · 미뇽맨션</p>
    </section>`;
  document.getElementById("retry").onclick = () => { track("retry", { result: myResult }); myResult = null; renderIntro(); };
  document.getElementById("copy").onclick = async () => {
    track("copy", { result: key });
    const text = `나에게 어울리는 방은 ‘${r.name}’ “${r.tagline}” 너는 무슨 방이야? ${location.origin + location.pathname} #미뇽맨션 #mnms`;
    const toast = document.getElementById("toast");
    try {
      await navigator.clipboard.writeText(text);
      toast.textContent = "복사했어요. 스토리나 댓글에 붙여 넣어 보세요";
    } catch (e) {
      toast.textContent = text;
    }
  };
  app.querySelectorAll("a.item").forEach(a => a.addEventListener("click", () => track("click", { result: key, product: a.dataset.name })));
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => { if (c.dataset.k !== myResult) track("browse", { result: c.dataset.k }); renderResult(c.dataset.k); });
  window.scrollTo(0, 0);
}

renderIntro();
</script>
